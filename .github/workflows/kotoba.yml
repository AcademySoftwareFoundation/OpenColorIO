# Fork-only Kotoba v1 checks. Not part of AcademySoftwareFoundation/OpenColorIO CI.

name: kotoba v1

on:
  push:
    paths:
      - "kotoba/**"
      - ".github/workflows/kotoba.yml"
  pull_request:
    paths:
      - "kotoba/**"
      - ".github/workflows/kotoba.yml"

permissions:
  contents: read

jobs:
  ocio-header:
    name: config header fields
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run kotoba/checks.sh
        run: bash kotoba/checks.sh
